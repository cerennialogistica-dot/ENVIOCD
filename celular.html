<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENVIOCD — Celular</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f9;color:#182230}header{background:#fff;border-bottom:1px solid #ddd;padding:15px 18px;position:sticky;top:0;z-index:5}main{max-width:1150px;margin:auto;padding:18px}.mobile{max-width:680px}.card{background:#fff;border:1px solid #e2e5e9;border-radius:14px;padding:17px;margin-bottom:15px}h2,h3{margin:0 0 12px}.muted{color:#667085;font-size:13px}label{font-size:12px;font-weight:bold;display:block;margin-bottom:5px}input,select{width:100%;height:48px;border:1px solid #cfd5dd;border-radius:9px;padding:0 12px;font-size:16px;margin-bottom:12px}.btn{border:0;border-radius:9px;padding:12px 14px;font-weight:bold;cursor:pointer}.primary{background:#087f78;color:#fff}.danger{background:#fee4e2;color:#b42318}.secondary{background:#eef4ff;color:#175cd3}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#fff;border:1px solid #ddd}.tab.active{background:#087f78;color:#fff}.view{display:none}.view.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.result{border:1px solid #ddd;padding:12px;border-radius:10px;margin:7px 0;cursor:pointer}.selected,.summary{background:#ecfdf3;border:1px solid #a6f4c5;border-radius:10px;padding:12px;margin-top:12px}.qtybox{height:58px!important;font-size:24px!important;font-weight:bold!important;text-align:center!important;border:2px solid #087f78!important}.cartrow{display:grid;grid-template-columns:1fr 120px 45px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e5e7eb}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{font-size:11px;color:#475467}.order{border-left:5px solid #087f78}.empty{text-align:center;padding:22px;color:#667085}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi b{font-size:22px;display:block}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:bold}.wait{background:#fff6ed;color:#b54708}.ok{background:#ecfdf3;color:#067647}.cancel{background:#fef3f2;color:#b42318}.online{color:#067647;font-weight:bold}.offline{color:#b42318;font-weight:bold}.signature{display:none}@media(max-width:800px){.grid2,.kpis{grid-template-columns:1fr}.cartrow{grid-template-columns:1fr 105px 42px}main{padding:12px}}@media print{header,.tabs,.noprint{display:none!important}.order:not(.printing){display:none}.card{border:0}.signature{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:70px}}</style><meta name="envio-cd-build" content="2026-08-12-corrigido">
</head><body><header><b>ENVIOCD — Envio pelo Celular</b><div class="muted">Firebase em tempo real • <span id="conn">conectando...</span></div></header><main class="mobile"><div class="card"><h2>Novo envio</h2><label>Usuário</label><select id="usuario"></select><label>Destino</label><select id="destino"><option value="CD">Envio CD</option><option value="PRODUTOS PARA ROTA">Produtos para Rota</option></select></div><div class="card"><h3>1. Buscar produto</h3><input id="busca" placeholder="Digite o código ou nome" oninput="buscar()"><div id="results"></div><div id="sel"></div></div><div class="card"><h3>2. Conferir pedido</h3><div id="cart"></div><div class="summary"><div class="row between"><span>Produtos diferentes</span><b id="ti">0</b></div><div class="row between"><span>Quantidade total</span><b id="tq">0</b></div></div><button class="btn primary" style="width:100%;font-size:17px;margin-top:14px" onclick="enviar()">ENVIAR PEDIDO COMPLETO</button></div><div class="card"><h3>Últimos envios</h3><div id="hist"></div></div></main>
<script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, onSnapshot, serverTimestamp, runTransaction, writeBatch, query, orderBy } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAm9sKe0LyBfXKDQpuI1bk899iezyP3wEk",
  authDomain: "enviocd-ab8db.firebaseapp.com",
  projectId: "enviocd-ab8db",
  storageBucket: "enviocd-ab8db.firebasestorage.app",
  messagingSenderId: "96013575856",
  appId: "1:96013575856:web:cb88e5195664f7ccf67d75"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let produtos=[],usuarios=[],pedidos=[],cart=[],selected=null;const $=s=>document.querySelector(s);
function conn(){$('#conn').textContent=navigator.onLine?'online':'sem internet';$('#conn').className=navigator.onLine?'online':'offline'}conn();addEventListener('online',conn);addEventListener('offline',conn);
onAuthStateChanged(auth,u=>{if(u)start();else signInAnonymously(auth).catch(e=>{console.error('Firebase Auth:',e);alert('Falha na autenticação: '+e.code+' — '+e.message)})});let started=false;function start(){if(started)return;started=true;onSnapshot(collection(db,'produtos'),s=>{produtos=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.ativo!==false)});onSnapshot(collection(db,'usuarios'),s=>{usuarios=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.ativo);renderUsers()});onSnapshot(collection(db,'pedidos'),s=>{pedidos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoMs||0)-(a.criadoMs||0));renderHist()})}
function renderUsers(){usuario.innerHTML=usuarios.length?'<option value="">Selecione seu nome</option>'+usuarios.map(u=>`<option>${u.nome}</option>`).join(''):'<option value="">Nenhum usuário ativo</option>'}
window.buscar=()=>{let f=busca.value.trim().toLowerCase();if(!f)return results.innerHTML='';let a=produtos.filter(p=>(p.codigo+' '+p.nome).toLowerCase().includes(f)).slice(0,12);results.innerHTML=a.length?a.map(p=>`<div class="result" onclick="selecionar('${p.id}')"><b>${p.codigo} — ${p.nome}</b><div class="muted">Toque para informar a quantidade</div></div>`).join(''):'<div class="empty">Produto não cadastrado.</div>'};
window.selecionar=id=>{selected=produtos.find(p=>p.id===id);busca.value='';results.innerHTML='';sel.innerHTML=`<div class="selected"><b>${selected.codigo} — ${selected.nome}</b><label style="margin-top:12px">QUANTIDADE QUE ESTÁ SENDO ENVIADA</label><input id="qn" class="qtybox" inputmode="numeric" type="number" min="1" placeholder="Digite a quantidade"><button class="btn primary" style="width:100%" onclick="adicionar()">ADICIONAR AO PEDIDO</button></div>`;setTimeout(()=>qn.focus(),50)};
window.adicionar=()=>{let q=parseInt(qn.value);if(!q||q<=0)return alert('A quantidade deve ser maior que ZERO.');let x=cart.find(i=>i.id===selected.id);if(x)x.quantidade+=q;else cart.push({...selected,quantidade:q});selected=null;sel.innerHTML='';renderCart();busca.focus()};
window.rm=id=>{cart=cart.filter(i=>i.id!==id);renderCart()};window.setQ=(id,v)=>{let x=cart.find(i=>i.id===id);if(x)x.quantidade=Math.max(1,parseInt(v)||1);renderTotals()};
function renderTotals(){ti.textContent=cart.length;tq.textContent=cart.reduce((s,i)=>s+Number(i.quantidade),0)}function renderCart(){cartEl=cart;document.getElementById('cart').innerHTML=cart.length?cart.map(i=>`<div class="cartrow"><div><b>${i.nome}</b><div class="muted">Código: ${i.codigo}</div></div><div><label>QUANTIDADE</label><input class="qtybox" type="number" min="1" value="${i.quantidade}" oninput="setQ('${i.id}',this.value)"></div><button class="btn danger" onclick="rm('${i.id}')">×</button></div>`).join(''):'<div class="empty">Nenhum produto adicionado.</div>';renderTotals()}
window.enviar=async()=>{if(!usuario.value)return alert('Selecione o usuário.');if(!cart.length)return alert('Adicione produtos.');if(cart.some(i=>Number(i.quantidade)<=0))return alert('Quantidade ZERO não é permitida.');let numero='';await runTransaction(db,async tx=>{const ref=doc(db,'configuracoes','contadorPedidos'),snap=await tx.get(ref);let n=snap.exists()?(snap.data().ultimo||0)+1:1;numero='ENV-'+String(n).padStart(6,'0');tx.set(ref,{ultimo:n},{merge:true})});await addDoc(collection(db,'pedidos'),{numero,usuario:usuario.value,destino:destino.value,dataHora:new Date().toLocaleString('pt-BR'),criadoMs:Date.now(),criadoEm:serverTimestamp(),status:'AGUARDANDO RECEBIMENTO',itens:cart.map(i=>({codigo:i.codigo,nome:i.nome,quantidade:Number(i.quantidade)}))});cart=[];renderCart();alert('Pedido '+numero+' enviado com sucesso!')};
function renderHist(){hist.innerHTML=pedidos.slice(0,5).map(p=>`<div style="padding:9px 0;border-bottom:1px solid #ddd"><b>${p.numero} • ${p.destino}</b><div class="muted">${p.usuario} • ${p.dataHora} • ${(p.itens||[]).reduce((s,i)=>s+Number(i.quantidade),0)} unidades • ${p.status}</div></div>`).join('')||'<div class="muted">Nenhum envio.</div>'}renderCart();
</script></body></html>
